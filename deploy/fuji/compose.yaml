# The Tasra SDK documentation on web-server. Its own compose project, deliberately.
#
# ⚠ It does NOT extend the keykeeper deployment's compose file. That one is GENERATED by
#   keykeeper-network/deploy/fuji/render.sh from topology.json and carries a "do not edit" banner;
#   an addition there would be silently lost on the next render. A separate project also means the
#   docs can be rebuilt or removed without touching nineteen running keepers.
#
# ⚠ No build: section. web-server builds nothing — the image arrives by `docker save | docker load`
#   (deploy/fuji/build.sh ship).
#
# There is no volume and no env_file: the image contains the whole site. Nothing here holds state,
# so unlike the vault and health stacks this project has nothing to lose and nothing to back up.
name: tasra-sdk-docs

services:

  docs:
    image: tasra-sdk-docs:fuji
    container_name: tasra-sdk-docs
    restart: unless-stopped
    # Container port 80, declared and NOT published to the host.
    #
    # ⚠⚠ HOST PORT 80 IS NOT AVAILABLE AND NEVER WILL BE: Nginx Proxy Manager (traefik-app-1) owns
    #    0.0.0.0:80 and :443 on this machine for ~35 sites. `ports: ["80:80"]` here would fail with
    #    "address already in use" — and is not what is wanted anyway, since NPM is the thing that
    #    must answer :80 and route by hostname.
    #
    # ⚠⚠ `expose` IS DOCUMENTATION, NOT PLUMBING. On a user-defined network every container can
    #    already reach every port of its peers, so this line does not grant NPM access — joining
    #    the shared `proxy` network below does. It is kept because it states the contract the proxy
    #    host depends on: the NPM host for this site must forward to tasra-sdk-docs:80.
    #    ⚠ Forwarding to :8081 is the mistake this replaces. 8081 only ever existed in the HOST's
    #      namespace as a published mapping; nothing has ever listened on 8081 INSIDE the container,
    #      so an NPM host pointed there answers 502.
    expose:
      - "80"

    # ⚠⚠ NO HOST PORT IS PUBLISHED, so the proxy is now the ONLY way in. That closes the plain-http
    #    8081 that ufw could not show (Docker's DOCKER chain is consulted before ufw's INPUT rules
    #    and DOCKER-USER is empty here) — but it also means the site is unreachable until BOTH the
    #    DNS record exists and the NPM host forwards to :80.
    networks: [default, proxy]
    # The site is read-only at runtime; nginx needs writable temp paths, which tmpfs supplies.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      # /healthz is served by nginx.conf itself, so this proves the server is answering without
      # depending on any page surviving a content change.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  proxy:
    external: true   # Nginx Proxy Manager owns it; this stack never creates it
