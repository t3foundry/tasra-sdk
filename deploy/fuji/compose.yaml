# The Tasra SDK documentation on web-server. Its own compose project, deliberately.
#
# ⚠ It does NOT extend the keykeeper deployment's compose file. That one is GENERATED by
#   keykeeper-network/deploy/fuji/render.sh from topology.json and carries a "do not edit" banner;
#   an addition there would be silently lost on the next render. A separate project also means the
#   docs can be rebuilt or removed without touching nineteen running keepers.
#
# ⚠ No build: section. web-server builds nothing — the image arrives by `docker save | docker load`
#   (deploy/fuji/build.sh ship).
#
# There is no volume and no env_file: the image contains the whole site. Nothing here holds state,
# so unlike the vault and health stacks this project has nothing to lose and nothing to back up.
name: tasra-sdk-docs

services:

  docs:
    image: tasra-sdk-docs:fuji
    container_name: tasra-sdk-docs
    restart: unless-stopped
    # ⚠⚠ 8081 IS PUBLISHED AND IS THEREFORE WORLD-REACHABLE ON PLAIN HTTP (operator's decision,
    #    2026-09-30, made with the following stated). ufw on this host allows only 22/tcp, 80/tcp
    #    and 443/tcp from anywhere and explicitly DENIES 81/tcp — but Docker writes its rules into
    #    the DOCKER chain, which is consulted BEFORE ufw's INPUT rules, and this host's DOCKER-USER
    #    chain is empty. So `ufw status` will go on reporting 8081 as closed while it answers the
    #    internet: do not read that output as evidence this port is shut.
    #    Nothing served here is secret — it is public documentation — but this port carries no TLS
    #    and is NOT the canonical origin (https://sdk.t3-foundry.fuji.tasra.network). Anything that
    #    indexes it will record the wrong origin for every page.
    #
    # ⚠ 8081-8089 is the KEEPER HTTP range in this deployment's port scheme, and
    #   keykeeper-network/deploy/fuji/firewall/kk-fuji-ports.sh drops that whole range from everyone
    #   but the ingress host. That unit runs on DEV-BOX ONLY, so it does not cover this container —
    #   the number simply reads as "keeper-1" to anyone scanning a port list on the wrong host.
    ports:
      - "8081:80"

    # NPM additionally reaches the container BY NAME on the shared `proxy` network, exactly as it
    # reaches kk-fuji-explorer-web and tasra-health-web. That path is what will serve the https
    # origin once the proxy host exists, and it does not depend on the published port above.
    networks: [default, proxy]
    # The site is read-only at runtime; nginx needs writable temp paths, which tmpfs supplies.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      # /healthz is served by nginx.conf itself, so this proves the server is answering without
      # depending on any page surviving a content change.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  proxy:
    external: true   # Nginx Proxy Manager owns it; this stack never creates it
