# The Tasra SDK documentation: a static Astro/Starlight build, served at the root of its own
# origin (https://sdk.t3-foundry.fuji.tasra.network). TLS is terminated by Nginx Proxy Manager
# in front of this container, so this server block is plain http on :80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── MIME corrections the default map gets wrong for THIS site ────────────────────────────
    # ⚠⚠ nginx maps `.ts` to video/mp2t (MPEG transport stream). The site publishes the SDK's
    #    TypeScript examples verbatim under /examples/*.ts, so with the default map a reader who
    #    clicks one is offered a media download instead of source, with no error shown. The sibling
    #    source extensions there — .mjs, .md, .template — are not in the map at all and inherit
    #    application/octet-stream from the base config, so they download for a different reason.
    #    .css, .html, .json and .pdf under /examples are mapped correctly and are left alone.
    #
    # ⚠⚠ THE EMPTY `types {}` IS THE FIX AND IT MUST STAY SCOPED TO THIS LOCATION. A `types` block
    #    in a nested context REPLACES the inherited map instead of adding to it, so the same
    #    override written at server level would discard all of mime.types — CSS and JS would go out
    #    as application/octet-stream and every page would render unstyled. `nginx -t` accepts both
    #    spellings; only a browser tells you which one you wrote.
    location ~ ^/examples/.+\.(ts|mjs|md|template)$ {
        types { }
        default_type text/plain;
    }

    # ⚠ The LICENSE is published without an extension. An unmapped extension DOES fall through to
    #   default_type, so no `types` games are needed here — the inherited default is
    #   application/octet-stream, which makes the browser download it rather than show it.
    location = /LICENSE { default_type text/plain; }

    # ── compression ─────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/manifest+json;
    # ⚠ text/html is always compressed and must NOT be listed — naming it makes nginx warn
    #   "duplicate MIME type text/html", and the warning is the only sign anything is wrong.

    # ── Starlight's search index ─────────────────────────────────────────────────────────────
    # ⚠⚠ /pagefind carries the ONLY working search, in files with extensions nginx has never heard
    #    of: .pagefind, .pf_meta, .pf_fragment, .pf_index, plus wasm.unknown.pagefind. They are
    #    fetched by JavaScript, so a wrong type or a 404 here does not break any page — the search
    #    box just returns nothing, for every query, silently. They are already compressed
    #    internally, so gzip here would only spend CPU re-compressing.
    location /pagefind/ {
        gzip off;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── caching ─────────────────────────────────────────────────────────────────────────────
    # _astro/* filenames carry a content hash, so they can never go stale: cache them for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ⚠ HTML must revalidate or a deploy does not take: pages are NOT content-hashed, so a cached
    #   index.html keeps pointing at the previous build's hashed assets, which the new deploy has
    #   already deleted — the reader sees an unstyled page until they hard-reload.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── routing ─────────────────────────────────────────────────────────────────────────────
    # Astro's default build format is `directory`, so every page is <slug>/index.html and a URL
    # without a trailing slash must still resolve.
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # Astro emits a real 404 page; without this nginx serves its own grey default.
    error_page 404 /404.html;
    location = /404.html { add_header Cache-Control "public, max-age=0, must-revalidate"; }

    # A liveness target for the container healthcheck that does not depend on any page's content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
