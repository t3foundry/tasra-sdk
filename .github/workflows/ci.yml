name: CI

on:
  # Every branch, so work in progress gets checked before a PR exists.
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      live_docs:
        description: 'Create a development slot and run Alice/Bob/Mallory on the compatible local fleet (develop only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two things at once:
#  - a newer push to the same branch makes the in-flight run obsolete, and
#  - a branch with an open PR would otherwise get TWO runs per push (one `push`,
#    one `pull_request`). Normalising to the branch NAME puts both in the same
#    group — `github.ref` would not, since it is `refs/heads/x` for a push but
#    `refs/pull/N/merge` for a PR — so the pull_request run supersedes the push one.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    name: node ${{ matrix.node }}
    # Untrusted pull requests run only on disposable hosted runners.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","mac-studio"]') }}
    # A hung job occupies the ONLY runner indefinitely — on a GitHub-hosted runner
    # the 6-hour default is harmless, here it blocks every later run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One runner, so the matrix serialises regardless; stating it keeps the queue
      # order predictable and stops three jobs contending for the same tool cache.
      max-parallel: 1
      matrix:
        # 22.12 is the engines floor: Node 20 reached end-of-life on 2026-04-30,
        # and 22.12 is the oldest supported release that can require() an ES
        # module. 24 is Active LTS, 26 is Current. Keep the floor in sync with
        # `engines.node` in package.json.
        node: ['22.12', '24', '26']

    steps:
      # `clean: true` is the default and load-bearing here: a self-hosted workspace
      # PERSISTS between runs, so without it a stale dist/ or node_modules/ can make
      # a broken commit look green.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `prepare` builds dist/, so this also compiles the library.
      - run: npm ci

      # Same entry point as local development. Node 24 covers all packages;
      # other supported SDK runtimes exercise the SDK gate without the Node-24 UI tools.
      - run: npm run verify
        if: matrix.node == '24'
      - run: npm run verify -- --sdk
        if: matrix.node != '24'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            .verification/report.json
            coverage/
          include-hidden-files: true
          retention-days: 14

  consumers:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify -- --consumers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-consumers
          path: .verification/report.json
          include-hidden-files: true
          retention-days: 14

  quality:
    name: Targeted security, mutation and performance checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run quality -- --changed
        if: github.event_name != 'schedule'
      - run: npm run quality -- --all
        if: github.event_name == 'schedule'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-evidence
          path: |
            .verification/quality/report.json
            .verification/mutation/report.json
            .verification/performance/report.json
          include-hidden-files: true
          retention-days: 14

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: /language:javascript-typescript

  documentation-live:
    # Explicit maintainer opt-in on the trusted trunk only. Never run fork PR code here.
    if: github.event_name == 'workflow_dispatch' && inputs.live_docs && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:docs
      - run: npm run test:docs:live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-account-public-evidence
          path: |
            .tasra/docs-evidence/evidence.json
            .tasra/docs-evidence/alice-receipt.json
            .tasra/docs-evidence/bob-receipt.json
            .tasra/docs-evidence/provenance.json
          retention-days: 14
