name: Release

# Publishes the package to npm when a `v*` tag is pushed.
#
# Publishing uses npm "trusted publishing": an OIDC token minted for this workflow,
# so no NPM_TOKEN is stored anywhere. That binding has to exist on npmjs.com first —
# package `tasra-sdk` → repository t3-foundry/tasra-sdk → workflow `release.yml`.
# Until configured, releases require an authorized manual publish.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted publishing and provenance both need an OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Publishing has a newer toolchain requirement than consuming the SDK.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm install --global npm@11.12.1
      - run: node --version && npm --version

      # `prepare` builds dist/ during install.
      - run: npm ci

      # Match the Git tag to package.json and choose the npm distribution tag.
      # Prereleases stay on `next`; stable versions advance `latest`.
      - name: Check release tag
        id: release_tag
        run: node scripts/release-tag.mjs

      # Repository gate; live deployment acceptance is recorded separately.
      - run: npm run verify

      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify -- --consumers

      # `--provenance` attaches a signed attestation linking this tarball to this
      # commit and workflow run, which npm shows on the package page. It requires a
      # public repository — npm cannot attest a publish from a private one.
      - run: npm publish --provenance --access public --tag "${{ steps.release_tag.outputs.npm_tag }}"
