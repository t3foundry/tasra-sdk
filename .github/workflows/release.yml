name: Release

# Publishes the package to npm when a `v*` tag is pushed.
#
# Publishing uses npm "trusted publishing": an OIDC token minted for this workflow,
# so no NPM_TOKEN is stored anywhere. That binding has to exist on npmjs.com first —
# package `tasra-sdk` → repository t3foundry/tasra-sdk → workflow `release.yml`.
# Until configured, releases require an authorized manual publish.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted publishing and provenance both need an OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Publishing has a newer toolchain requirement than consuming the SDK.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm install --global npm@11.12.1
      - run: node --version && npm --version

      # `prepare` builds dist/ during install.
      - run: npm ci

      # Match the Git tag to package.json and choose the npm distribution tag.
      # Prereleases stay on `next`; stable versions advance `latest`.
      - name: Check release tag
        id: release_tag
        run: node scripts/release-tag.mjs

      # npm ONLY FOR A CERTIFIED COMMIT (keykeeper-network release model, 2026-11-18): a release
      # candidate is a keykeeper-network commit plus a tasra-sdk commit, certified together, and
      # nothing reaches npm before that pair's keykeeper-network release is published. That release
      # (t3foundry/tasra-releases vX.Y.Z) names this SDK in release-manifest.json and ships its
      # tarball. This tag publishes only if such a published, certified, non-prerelease release names
      # exactly this commit, package, version and npm integrity (scripts/certified-release.mjs), AND
      # that release's SHA256SUMS - which covers the manifest - carries a cosign signature made by
      # keykeeper-network's release workflow on a version tag. Early, before the long verification.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Certified with a keykeeper-network release?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/certified"; mkdir -p "$work/pack" "$work/r"
          integrity="$(npm pack --json --ignore-scripts --pack-destination "$work/pack" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].integrity))")"
          : > "$work/releases.ndjson"
          while IFS=$'\t' read -r tag pre; do
            d="$work/r/$tag"; mkdir -p "$d"
            gh release download "$tag" -R t3foundry/tasra-releases -D "$d" \
              -p release-manifest.json -p SHA256SUMS -p SHA256SUMS.sigstore.json 2>/dev/null || continue
            jq -c --arg t "$tag" --argjson p "$pre" '{tag: $t, isPrerelease: $p, manifest: .}' \
              "$d/release-manifest.json" >> "$work/releases.ndjson"
          done < <(gh release list -R t3foundry/tasra-releases --exclude-drafts --limit 100 \
                     --json tagName,isPrerelease --jq '.[] | [.tagName, .isPrerelease] | @tsv')
          tag="$(node scripts/certified-release.mjs "$work/releases.ndjson" "$GITHUB_SHA" "$integrity")"
          d="$work/r/$tag"
          cosign verify-blob --bundle "$d/SHA256SUMS.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/managination/keykeeper-network/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            "$d/SHA256SUMS"
          ( cd "$d" && grep -E '  release-manifest\.json$' SHA256SUMS | sha256sum -c - )
          echo "::notice::certified with keykeeper-network $tag (signature and manifest checksum verified)"

      # Repository gate; live deployment acceptance is recorded separately.
      - run: npm run verify

      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify -- --consumers

      # A version already on npm (published by hand, as 0.4.0 was on 2026-11-04, while trusted
      # publishing is not bound to the package) is verified, not republished — npm refuses a second
      # publish of a version anyway. Instead the tag must pack EXACTLY the published tarball, so the
      # registry artifact is tied to this commit even without a provenance attestation.
      - name: Already on npm?
        id: published
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
          if [ -z "$published" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          local_integrity="$(npm pack --json --ignore-scripts | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].integrity))")"
          if [ "$local_integrity" != "$published" ]; then
            echo "::error::$name@$version on npm ($published) is not what this tag packs ($local_integrity)"
            exit 1
          fi
          echo "::notice::$name@$version is already on npm and identical to this tag's pack: not republishing"

      # `--provenance` attaches a signed attestation linking this tarball to this
      # commit and workflow run, which npm shows on the package page. It requires a
      # public repository — npm cannot attest a publish from a private one.
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public --tag "${{ steps.release_tag.outputs.npm_tag }}"
